version: 1.0
runtime: python3

build:
  commands:
    build:
      - python -m ensurepip --upgrade      # ensure pip exists
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

run:
  runtime-version: 3.11
  command: uvicorn app:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
